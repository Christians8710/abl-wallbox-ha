name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
          cache: pip
      - name: Install stable Home Assistant and test dependencies
        run: python -m pip install -r requirements-dev.txt homeassistant==2026.10.4 pytest-homeassistant-custom-component
      - name: Lint
        run: python -m ruff check custom_components tests
      - name: Protocol and Home Assistant tests
        run: python -m pytest -q
