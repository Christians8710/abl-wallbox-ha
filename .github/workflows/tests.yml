name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check custom_components tests
      - run: python -m pytest -q tests/test_protocol.py tests/test_shelly.py
      - run: node --test tests/shelly-bridge.test.cjs
  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
          cache: pip
      - name: Install stable Home Assistant and test dependencies
        run: python -m pip install homeassistant==2026.10.4 pytest-homeassistant-custom-component==0.13.375 ruff==0.17.3 pyserial==3.5
      - name: Lint
        run: python -m ruff check custom_components tests
      - name: Home Assistant setup and entity tests
        run: python -m pytest -q tests/test_homeassistant.py
